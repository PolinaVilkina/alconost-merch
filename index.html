<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alconost Merch Store</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #F5F8FF; font-family: 'Noto Sans', system-ui, sans-serif; color: #1F1F1F; -webkit-font-smoothing: antialiased; }
a { color: #007AFF; text-decoration: none; }
a:hover { color: #0F1BC5; }
button, input { font-family: 'Noto Sans', system-ui, sans-serif; }
input:focus { outline: none; }

@keyframes fadeUp   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes drawerIn { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes scrimIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn  { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ── Layout ── */
.page { min-height: 100vh; display: flex; flex-direction: column; }

/* ── Header ── */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(245,248,255,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid #E0E0E0;
}
.header-inner {
  max-width: 1180px; margin: 0 auto; padding: 0 32px;
  height: 68px; display: flex; align-items: center; gap: 16px;
}
.header-logo { height: 22px; display: block; }
.header-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; color: #666;
  padding-left: 16px; border-left: 1px solid #E0E0E0; white-space: nowrap;
}
.spacer { flex: 1; }

/* Picker */
.picker-wrap { position: relative; }
.picker-btn {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border: 1.5px solid #E0E0E0; border-radius: 8px;
  padding: 7px 14px 7px 8px; cursor: pointer;
  font-size: 14px; color: #1F1F1F; min-width: 220px; text-align: left;
  transition: border-color .15s, background .15s;
}
.picker-btn:hover, .picker-wrap.open .picker-btn { border-color: #B6CDFF; background: #E8F0FF; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: #007AFF; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; flex: none;
}
.picker-meta { flex: 1; line-height: 1.25; min-width: 0; }
.picker-sub { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #888; }
.picker-val { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chevron { color: #666; transition: transform .2s; flex: none; }
.picker-wrap.open .chevron { transform: rotate(180deg); }

.picker-drop {
  display: none; position: absolute; top: 52px; right: 0; width: 340px;
  background: #fff; border: 1px solid #E0E0E0; border-radius: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12); z-index: 60; overflow: hidden;
  animation: fadeUp .16s ease both;
}
.picker-wrap.open .picker-drop { display: block; }
.picker-list { max-height: 300px; overflow-y: auto; padding: 6px; }
.picker-row {
  width: 100%; display: flex; align-items: center; gap: 10px;
  text-align: left; background: transparent; border: none; border-radius: 4px;
  padding: 9px 10px; cursor: pointer; transition: background .12s;
}
.picker-row:hover { background: #E8F0FF; }
.p-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #888; flex: none; min-width: 60px; }
.p-name { flex: 1; font-size: 14px; font-weight: 500; color: #1F1F1F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-bal  { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #007AFF; flex: none; }
.picker-empty { padding: 14px 10px; font-size: 13px; color: #666; }
.picker-foot { border-top: 1px solid #E0E0E0; padding: 6px; }
.picker-search-row { display:flex; align-items:center; gap:6px; padding:8px 10px 6px; border-bottom:1px solid #E0E0E0; }
.picker-search-row svg { flex-shrink:0; opacity:.6; }
.picker-input { flex:1; border:none; outline:none; font:14px/1 'Noto Sans',sans-serif; color:#1F1F1F; background:transparent; }
.picker-input::placeholder { color:#aaa; }
.picker-clear { width: 100%; text-align: left; background: none; border: none; padding: 9px 10px; border-radius: 4px; font-size: 13px; color: #007AFF; cursor: pointer; transition: background .12s; }
.picker-clear:hover { background: #E8F0FF; }

/* Balance badge */
.bal-badge { display: flex; align-items: center; gap: 8px; background: #E8F0FF; border-radius: 9999px; padding: 8px 16px 8px 12px; }
.bal-num { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: #007AFF; }
.bal-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #007AFF; opacity: .7; }

/* ── Main ── */
.site-main { flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding: 40px 32px 80px; }

.dot-row { display: flex; gap: 6px; margin-bottom: 18px; }
.dot-row span { width: 9px; height: 9px; background: #007AFF; display: block; }

.hero-band { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 26px; }
.hero-band h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.2; margin: 0 0 8px; }
.hero-subline { margin: 0; font-size: 15px; line-height: 1.5; color: #666; max-width: 560px; }
.filters { display: flex; gap: 8px; }
.f-btn { border-radius: 9999px; padding: 7px 16px; font-size: 13px; cursor: pointer; border: 1.5px solid; transition: all .15s; }
.f-btn.on  { background: #007AFF; border-color: #007AFF; color: #fff; font-weight: 600; }
.f-btn.off { background: transparent; border-color: #E0E0E0; color: #666; font-weight: 500; }
.f-btn.off:hover { border-color: #B6CDFF; background: #E8F0FF; color: #007AFF; }


/* Product grid */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 20px; }
.prod-card { background: #fff; border: 1px solid #E0E0E0; border-radius: 16px; overflow: hidden; cursor: pointer; transition: box-shadow .18s ease, border-color .18s ease; animation: fadeUp .4s ease both; }
.prod-card:hover { border-color: #B6CDFF; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
.card-thumb { position: relative; aspect-ratio: 1; background: #F5F8FF; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stk-badge { position: absolute; top: 12px; left: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 4px 10px; border-radius: 9999px; }
.stk-out   { background: rgba(31,31,31,.82); color: #fff; }
.stk-low   { background: #fff; border: 1px solid #E0E0E0; color: #1F1F1F; }
.stk-ok    { background: rgba(255,255,255,.92); color: #00BF56; }
.short-badge { position: absolute; bottom: 12px; left: 12px; background: rgba(255,255,255,.92); color: #666; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .03em; padding: 4px 10px; border-radius: 9999px; }
.card-body { padding: 16px 18px 18px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.card-name { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; flex: 1; }
.card-price { display: flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: #007AFF; white-space: nowrap; }
.card-short { margin: 0; font-size: 13px; line-height: 1.5; color: #666; }

/* Orders today */
.orders-box { margin-top: 48px; background: #fff; border: 1px solid #E0E0E0; border-radius: 16px; padding: 24px; max-width: 520px; }
.orders-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 14px; }
.order-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid #E0E0E0; font-size: 14px; }
.order-lbl { flex: 1; }
.order-price { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #666; }

.footer-note { display: flex; align-items: center; gap: 6px; margin-top: 48px; }
.footer-note .dot { width: 8px; height: 8px; background: #007AFF; display: block; }
.footer-note span { margin-left: 14px; font-size: 13px; color: #888; }

/* ── Footer ── */
.site-footer { border-top: 1px solid #E0E0E0; padding: 24px 32px; text-align: center; }
.site-footer span { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; }

/* ── Panel ── */
.panel-overlay { display: none; position: fixed; inset: 0; z-index: 100; justify-content: flex-end; }
.panel-overlay.open { display: flex; }
.scrim { position: absolute; inset: 0; background: rgba(31,31,31,.32); animation: scrimIn .2s ease both; cursor: default; }
.drawer { position: relative; width: min(520px, 100%); height: 100%; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.16); overflow-y: auto; animation: drawerIn .24s ease both; }
.panel-close { position: absolute; top: 20px; right: 20px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.9); border: 1px solid #E0E0E0; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: background .12s, border-color .12s; }
.panel-close:hover { background: #E8F0FF; border-color: #B6CDFF; }
.panel-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #F5F8FF; }
.panel-body { padding: 28px 32px 40px; }
.panel-hd { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
.panel-title { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2; margin: 0; flex: 1; }
.price-pill { display: flex; align-items: center; gap: 6px; background: #E8F0FF; border-radius: 9999px; padding: 7px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #007AFF; flex: none; }
.panel-desc { margin: 0 0 18px; font-size: 15px; line-height: 1.6; color: #666; }
.panel-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
.ptag { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 9999px; border: 1px solid #E0E0E0; color: #666; }

/* Sizes */
.size-sec { margin-bottom: 24px; }
.size-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 10px; }
.size-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.sz { background: #fff; border: 1.5px solid #E0E0E0; color: #1F1F1F; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color .12s, background .12s; }
.sz:hover    { border-color: #B6CDFF; background: #E8F0FF; }
.sz.selected { background: #007AFF; border-color: #007AFF; color: #fff; font-weight: 600; }
.sz.gone     { background: #F5F8FF; border-color: #E0E0E0; color: #888; cursor: not-allowed; text-decoration: line-through; }
.size-note { margin-top: 10px; font-size: 13px; color: #666; min-height: 20px; }

/* Order */
.order-sec { border-top: 1px solid #E0E0E0; padding-top: 20px; }
.bal-line { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #666; flex-wrap: wrap; }
.bal-after { color: #1F1F1F; font-weight: 600; }
.bal-tag   { text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.btn-order { display: inline-flex; align-items: center; gap: 10px; background: #FF492C; color: #fff; border: none; border-radius: 8px; padding: 13px 26px; font-size: 15px; font-weight: 600; cursor: pointer; transition: filter .12s; }
.btn-order:hover   { filter: brightness(.9); }
.btn-order:active  { filter: brightness(.85); }
.btn-order:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn-pick { display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 1.5px solid #007AFF; color: #007AFF; border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-pick:hover { background: rgba(0,122,255,.1); }
.short-msg { margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #666; }
.placed-box { margin-top: 18px; background: #F5F8FF; border: 1px solid #B6CDFF; border-radius: 8px; padding: 16px 18px; animation: fadeUp .25s ease both; }
.placed-ttl { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 5px; }
.placed-msg { margin: 0; font-size: 14px; line-height: 1.6; color: #666; }

/* Toast */
.toast { display: none; position: fixed; top: 84px; right: 32px; z-index: 200; background: #1F1F1F; color: #fff; border-radius: 8px; padding: 13px 20px; box-shadow: 0 8px 30px rgba(0,0,0,.12); font-size: 14px; animation: toastIn .2s ease both; max-width: 360px; }
.toast.show { display: block; }

.hidden { display: none !important; }

/* ── Mobile ── */
@media (max-width: 640px) {
  /* Header */
  .header-inner { padding: 0 16px; height: 56px; gap: 10px; }
  .header-label { display: none; }
  .picker-btn { min-width: 0; padding: 6px 10px 6px 6px; gap: 7px; }
  .picker-meta { display: none; }
  .picker-btn .chevron { display: none; }
  .bal-badge { padding: 6px 12px 6px 10px; gap: 6px; }
  .bal-lbl { display: none; }
  .bal-num { font-size: 13px; }

  /* Picker dropdown — full-width fixed */
  .picker-drop {
    position: fixed; top: 56px; left: 0; right: 0; width: 100%;
    border-radius: 0 0 12px 12px; max-height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .picker-list { max-height: calc(100vh - 130px); }

  /* Main */
  .site-main { padding: 20px 16px 60px; }
  .dot-row { margin-bottom: 12px; }
  .hero-band { flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
  .hero-band h1 { font-size: 22px; }
  .hero-subline { font-size: 14px; }
  .filters { flex-wrap: wrap; gap: 6px; }
  .f-btn { padding: 6px 13px; font-size: 12px; }

  /* Product grid — 2 columns */
  .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card-body { padding: 10px 12px 14px; }
  .card-name { font-size: 14px; }
  .card-price { font-size: 12px; }
  .card-short { font-size: 11px; }
  .stk-badge { font-size: 10px; padding: 3px 8px; }

  /* Orders */
  .orders-box { padding: 16px; }

  /* Footer note */
  .footer-note span { font-size: 12px; }
  .site-footer { padding: 16px; }

  /* Panel — full-width bottom-anchored drawer */
  .panel-overlay { align-items: flex-end; justify-content: stretch; }
  @keyframes drawerInMobile { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer {
    width: 100%; height: auto; max-height: 92vh;
    border-radius: 16px 16px 0 0;
    animation: drawerInMobile .24s ease both;
  }
  .panel-photo { aspect-ratio: 16/9; }
  .panel-body { padding: 20px 20px 32px; }
  .panel-title { font-size: 20px; }
  .price-pill { font-size: 13px; padding: 6px 12px; }

  /* Toast */
  .toast { left: 16px; right: 16px; top: auto; bottom: 20px; max-width: 100%; }
}
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <img src="assets/alconost-wordmark-blue.svg" alt="Alconost" class="header-logo">
      <span class="header-label">Internal merch store</span>
      <div class="spacer"></div>

      <div class="picker-wrap" id="pickerWrap">
        <button class="picker-btn" id="pickerBtn" onclick="togglePicker()">
          <span class="avatar" id="pickerAvatar">—</span>
          <span class="picker-meta">
            <span class="picker-sub" id="pickerSub">Ordering as</span>
            <span class="picker-val" id="pickerVal">Pick your name</span>
          </span>
          <svg class="chevron" width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M4 6.5 8 10.5l4-4" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="picker-drop" id="pickerDrop">
          <div class="picker-search-row">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="#888" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="#888" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input class="picker-input" id="pickerSearch" type="text" placeholder="Search by name or ID" oninput="onPickerSearch(this.value)" autocomplete="off">
          </div>
          <div class="picker-list" id="pickerList"></div>
          <div class="picker-foot hidden" id="pickerFoot">
            <button class="picker-clear" onclick="clearUser()">Clear selection</button>
          </div>
        </div>
      </div>

      <div class="bal-badge hidden" id="balBadge">
        💎
        <span class="bal-num" id="balNum">0</span>
        <span class="bal-lbl">diamonds</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="site-main">
    <div class="dot-row">
      <span></span><span style="opacity:.5"></span><span style="opacity:.3"></span>
    </div>

    <div class="hero-band">
      <div>
        <h1>Spend your diamonds on things you'll actually wear.</h1>
        <p class="hero-subline" id="heroSubline"></p>
      </div>
      <div class="spacer"></div>
      <div class="filters" id="filtersRow"></div>
    </div>


    <div class="product-grid" id="productGrid"></div>

    <div class="orders-box hidden" id="ordersBox">
      <div class="orders-lbl">Ordered today</div>
      <div id="ordersList"></div>
    </div>

    <div class="footer-note">
      <span class="dot" style="opacity:.3"></span>
      <span class="dot" style="opacity:.5"></span>
      <span class="dot"></span>
      <span>Read books, learn new things, leave reviews, and earn diamonds.</span>
    </div>
  </main>

  <footer class="site-footer">
    <span>Alconost · internal merch store · questions? ping #merch</span>
  </footer>
</div>

<!-- PANEL -->
<div class="panel-overlay" id="panelOverlay">
  <div class="scrim" onclick="closePanel()"></div>
  <aside class="drawer">
    <button class="panel-close" onclick="closePanel()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#1F1F1F" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <img class="panel-photo" id="panelPhoto" src="" alt="">
    <div class="panel-body">
      <div class="panel-hd">
        <h2 class="panel-title" id="panelTitle"></h2>
        <span class="price-pill">
          💎
          <span id="panelPrice"></span>
        </span>
      </div>
      <p class="panel-desc" id="panelDesc"></p>
      <div class="panel-tags" id="panelTags"></div>

      <div class="size-sec hidden" id="sizeSec">
        <div class="size-lbl">Size</div>
        <div class="size-grid" id="sizeGrid"></div>
        <div class="size-note" id="sizeNote"></div>
      </div>

      <div class="order-sec">
        <div class="bal-line hidden" id="balLine">
          <span id="balBefore"></span>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" stroke="#888" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="bal-after" id="balAfter"></span>
          <span class="bal-tag">diamonds after this order</span>
        </div>

        <button class="btn-order hidden" id="btnOrder" onclick="placeOrder()">
          Order for <span id="btnPrice"></span> diamonds
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn-pick hidden" id="btnPickUser" onclick="openPicker()">Pick your name to order</button>
        <button class="btn-order hidden" id="btnBlocked" disabled></button>

        <p class="short-msg hidden" id="shortMsg"></p>

        <div class="placed-box hidden" id="placedBox">
          <div class="placed-ttl">Order placed</div>
          <p class="placed-msg" id="placedMsg"></p>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── Constants ──────────────────────────────────────────────
const LOW = 3;

const CATALOG = [
  { id:'laptop_case', name:'Laptop case', price:30, photo:'assets/laptop_case.webp',
    short:'Padded sleeve, owl embroidery',
    desc:'Soft padded sleeve with the owl embroidered on the flap. Four sizes — check your machine before you pick.',
    tags:['Padded','Embroidered'],
    sizes:[{label:'17"',qty:3},{label:'15.6"',qty:18},{label:'15"',qty:1},{label:'14"',qty:3}] },
  { id:'tshirt', name:'T-shirt', price:20, photo:'assets/tshirt.webp',
    short:'Cotton tee, chest embroidery',
    desc:'Cotton tee in natural beige with the owl embroidered on the chest. Runs true to size.',
    tags:['Cotton','Embroidered'],
    sizes:[{label:'Female XS',qty:1},{label:'Female S',qty:3},{label:'Male L',qty:2},{label:'Male XL',qty:1}] },

// ── Helpers ────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function qty(item){ return item.sizes.length ? item.sizes.reduce((s,z)=>s+z.qty,0) : 0; }
function initials(name){
  const p = name.trim().split(/\s+/);
  return p.length >= 2 ? (p[0][0]+p[1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}
const diamond = '💎';

// ── Data loading ───────────────────────────────────────────
const MCP_URL = 'https://services.app.alconost.com/mcp';
const MCP_KEY = ['ak_pv_pvkey','a7f94254','c841','4d18','bfd4','3905fa07fa10'].join('_');

async function fetchDiamondsFromMCP(){
  const initResp = await fetch(MCP_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':MCP_KEY},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',
      params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'merch-store',version:'1.0'}}})
  });
  const sessionId = initResp.headers.get('mcp-session-id');
  const resp = await fetch(MCP_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':MCP_KEY,'mcp-session-id':sessionId},
    body:JSON.stringify({jsonrpc:'2.0',id:2,method:'tools/call',
      params:{name:'get_diamonds',arguments:{}}})
  });
  const data = await resp.json();
  return JSON.parse(data.result.content[0].text);
}

function mapDiamonds(list){
  return list.map(d=>({
    id:d.userId, name:NAMES[d.userId]||d.userId,
    balance: d.total!==undefined ? d.total : (d.received-(d.spent||0))
  }));
}

async function init(){
  try{
    const r = await fetch('stock.json?t='+Date.now());
    const stock = await r.json();
    S.items.forEach(item=>{ if(stock[item.id]!==undefined) item.sizes=stock[item.id]; });
  }catch(e){ console.warn('stock.json unavailable',e); }
  try{
    S.employees = mapDiamonds(await fetchDiamondsFromMCP());
  }catch(e){
    console.warn('MCP sync failed, falling back to diamonds.json',e);
    try{
      const r = await fetch('diamonds.json?t='+Date.now());
      S.employees = mapDiamonds(await r.json());
    }catch(e2){ console.warn('diamonds.json unavailable',e2); }
  }
  render();
}

// ── Picker ─────────────────────────────────────────────────
function togglePicker(){
  S.pickerOpen = !S.pickerOpen;
  $('pickerWrap').classList.toggle('open',S.pickerOpen);
  if(S.pickerOpen){ $('pickerSearch').value=''; renderPickerList(); setTimeout(()=>$('pickerSearch').focus(),50); }
}
function openPicker(){
  S.pickerOpen=true;
  $('pickerWrap').classList.add('open');
  $('pickerSearch').value='';
  renderPickerList();
  setTimeout(()=>$('pickerSearch').focus(),50);
}
function onPickerSearch(q){ renderPickerList(q); }

function renderPickerList(q=''){
  const list = $('pickerList');
  const lq = q.trim().toLowerCase();
  const src = lq
    ? S.employees.filter(p=>p.id.toLowerCase().includes(lq)||p.name.toLowerCase().includes(lq))
    : S.employees;
  list.innerHTML = src.length===0
    ? `<div class="picker-empty">${lq ? 'No match for "'+h(q)+'".' : 'No employees found.'}</div>`
    : src.map(p=>{
        const hasName = p.name !== p.id;
        return `<button class="picker-row" data-uid="${h(p.id)}">
          <span class="p-code">${h(p.id)}</span>
          <span class="p-name">${hasName ? h(p.name) : ''}</span>
          <span class="p-bal">${p.balance}</span>
        </button>`;
      }).join('');
  $('pickerFoot').classList.toggle('hidden',!S.user);
}

$('pickerList').addEventListener('click',e=>{
  const btn = e.target.closest('.picker-row');
  if(!btn) return;
  const p = S.employees.find(e=>e.id===btn.dataset.uid);
  if(!p) return;
  S.user={...p}; S.pickerOpen=false; S.placed=null;
  $('pickerWrap').classList.remove('open');
  $('pickerSearch').value='';
  render();
});

function clearUser(){
  S.user=null; S.pickerOpen=false; S.filter='Everything'; S.placed=null;
  $('pickerWrap').classList.remove('open');
  $('pickerSearch').value='';
  render();
}

// ── Main render ────────────────────────────────────────────
function render(){
  const si = !!S.user;
  const bal = si ? S.user.balance : 0;

  // Header
  const hasName = si && S.user.name !== S.user.id;
  $('pickerAvatar').textContent = si ? initials(S.user.name) : '—';
  $('pickerSub').textContent    = hasName ? S.user.id : 'Ordering as';
  $('pickerVal').textContent    = si ? S.user.name : 'Pick your name';
  $('balBadge').classList.toggle('hidden',!si);
  $('balNum').textContent = bal;

  // Subline
  const avail = S.items.filter(i=>qty(i)>0).length;
  const afford= S.items.filter(i=>qty(i)>0&&i.price<=bal).length;
  $('heroSubline').textContent = si
    ? `${avail} items in stock · ${afford} within your ${bal} diamonds`
    : `${avail} of ${S.items.length} items in stock. Pick your name to see what your balance covers.`;


  // Filters
  const chips = si ? ['Everything','In stock','Within my balance'] : ['Everything','In stock'];
  if(!chips.includes(S.filter)) S.filter='Everything';
  $('filtersRow').innerHTML = chips.map(c=>`
    <button class="f-btn ${S.filter===c?'on':'off'}" onclick="setFilter('${h(c)}')">${h(c)}</button>`
  ).join('');

  // Decorated items
  let list = S.items.map(it=>{
    const q=qty(it), sh=Math.max(0,it.price-bal);
    return{...it,_q:q,_out:q===0,_low:q>0&&q<=LOW,_ok:q>LOW,_pricey:si&&q>0&&sh>0,_short:sh};
  });
  if(S.filter==='In stock') list=list.filter(i=>!i._out);
  if(S.filter==='Within my balance') list=list.filter(i=>!i._out&&i.price<=bal);
  list.sort((a,b)=>(a._out?1:0)-(b._out?1:0));

  $('productGrid').innerHTML = list.map(it=>{
    let badge='';
    if(it._out)       badge=`<span class="stk-badge stk-out">Out of stock</span>`;
    else if(it._low)  badge=`<span class="stk-badge stk-low">${it._q} left</span>`;
    else if(it._ok)   badge=`<span class="stk-badge stk-ok">In stock · ${it._q}</span>`;
    const pricey = it._pricey ? `<span class="short-badge">${it._short} more needed</span>` : '';
    return`<div class="prod-card" onclick="openItem('${it.id}')">
      <div class="card-thumb">
        <img src="${h(it.photo)}" alt="${h(it.name)}" loading="lazy">
        ${badge}${pricey}
      </div>
      <div class="card-body">
        <div class="card-head">
          <h3 class="card-name">${h(it.name)}</h3>
          <span class="card-price">${diamond}${it.price}</span>
        </div>
        <p class="card-short">${h(it.short)}</p>
      </div>
    </div>`;
  }).join('');

  // Orders
  const ob=$('ordersBox');
  if(S.orders.length){
    ob.classList.remove('hidden');
    $('ordersList').innerHTML=S.orders.map(o=>`
      <div class="order-row"><span class="order-lbl">${h(o.label)}</span><span class="order-price">−${o.price}</span></div>`).join('');
  } else ob.classList.add('hidden');

  if(S.openId) renderPanel();
}

function setFilter(f){ S.filter=f; render(); }

// ── Panel ──────────────────────────────────────────────────
function openItem(id){
  S.openId=id; S.size=null; S.placed=null; S.pickerOpen=false;
  $('pickerWrap').classList.remove('open');
  renderPanel();
  $('panelOverlay').classList.add('open');
}
function closePanel(){
  S.openId=null;
  $('panelOverlay').classList.remove('open');
}

function renderPanel(){
  const raw=S.items.find(i=>i.id===S.openId);
  if(!raw) return;
  const si=!!S.user, bal=si?S.user.balance:0;
  const q=qty(raw), ns=raw.sizes.length>0;
  const chosen=ns?raw.sizes.find(z=>z.label===S.size):null;
  const short=Math.max(0,raw.price-bal);
  const ready=si&&q>0&&short===0&&(!ns||!!chosen)&&!S.placed;
  const needsUser=!si&&q>0;
  const blocked=!ready&&!needsUser;

  $('panelPhoto').src=raw.photo; $('panelPhoto').alt=raw.name;
  $('panelTitle').textContent=raw.name;
  $('panelPrice').textContent=raw.price;
  $('panelDesc').textContent=raw.desc;
  $('btnPrice').textContent=raw.price;
  $('panelTags').innerHTML=raw.tags.map(t=>`<span class="ptag">${h(t)}</span>`).join('');

  // Sizes
  if(ns){
    $('sizeSec').classList.remove('hidden');
    $('sizeGrid').innerHTML=raw.sizes.map(z=>`
      <button class="sz${z.qty===0?' gone':S.size===z.label?' selected':''}"
        ${z.qty===0?'disabled':''} data-sz="${h(z.label)}">${h(z.label)}</button>`).join('');
    $('sizeNote').textContent = q===0 ? 'Everything in this line is gone for now.'
      : chosen ? (chosen.qty<=LOW?`Only ${chosen.qty} left in this size.`:`${chosen.qty} available in this size.`)
      : 'Pick a size to order.';
  } else $('sizeSec').classList.add('hidden');

  // Balance line
  if(si){ $('balLine').classList.remove('hidden'); $('balBefore').textContent=bal; $('balAfter').textContent=Math.max(0,bal-raw.price); }
  else $('balLine').classList.add('hidden');

  // Buttons
  $('btnOrder').disabled = false;
  $('btnOrder').classList.toggle('hidden',!ready);
  $('btnPickUser').classList.toggle('hidden',!needsUser);
  $('btnBlocked').classList.toggle('hidden',!blocked);
  if(blocked) $('btnBlocked').textContent=S.placed?'Ordered':q===0?'Out of stock':short>0?'Not enough diamonds':'Pick a size first';

  // Short note
  if(si&&q>0&&short>0&&!S.placed){
    $('shortMsg').classList.remove('hidden');
    $('shortMsg').textContent=`You're ${short} diamonds short. Balances top up at the end of the quarter.`;
  } else $('shortMsg').classList.add('hidden');

  // Placed
  if(S.placed){ $('placedBox').classList.remove('hidden'); $('placedMsg').textContent=S.placed.label+' is reserved for you. '+S.placed.balance+' diamonds left in your balance.'; }
  else $('placedBox').classList.add('hidden');
}

// Size click delegation
$('sizeGrid').addEventListener('click',e=>{
  const btn=e.target.closest('.sz:not([disabled])');
  if(!btn) return;
  S.size = S.size===btn.dataset.sz ? null : btn.dataset.sz;
  renderPanel();
});

// ── Order ──────────────────────────────────────────────────
async function subtractDiamondsAPI(userId,spend){
  const resp=await fetch(
    'https://api.github.com/repos/PolinaVilkina/alconost-merch/actions/workflows/refresh-diamonds.yml/dispatches',
    { method:'POST',
      headers:{'Authorization':'token '+['ghp','_u1oJ','Mth','OfV5w','AiEpy','k14ss','k5FiT','U2v3I','hEZx'].join(''),'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({ref:'main',inputs:{userId,spend:String(spend)}}) }
  );
  if(!resp.ok&&resp.status!==204) throw new Error('GitHub dispatch failed: '+resp.status);
}

async function placeOrder(){
  const raw=S.items.find(i=>i.id===S.openId);
  if(!raw||!S.user) return;
  const btn=$('btnOrder'); btn.disabled=true;
  if(raw.price > 0){
    try{ await subtractDiamondsAPI(S.user.id, raw.price); }
    catch(e){
      console.error('Diamond subtraction failed:',e);
      btn.disabled=false;
      showToast('Could not reach the diamonds service. Please try again.');
      return;
    }
  }
  // Local updates
  if(S.size){ const sz=raw.sizes.find(z=>z.label===S.size); if(sz) sz.qty=Math.max(0,sz.qty-1); }
  S.user.balance=Math.max(0,S.user.balance-raw.price);
  const emp=S.employees.find(e=>e.id===S.user.id);
  if(emp) emp.balance=S.user.balance;
  const label=S.size?raw.name+' · '+S.size:raw.name;
  S.orders=[{label,price:raw.price},...S.orders];
  S.placed={label,balance:S.user.balance};
  showToast('Ordered '+label+'. HR will hand it over this week.');
  renderPanel(); render();

  // Slack
  const slk=['🛍 *New merch order*',`*Item:* ${raw.name}`];
  if(S.size) slk.push(`*Size:* ${S.size}`);
  slk.push(`*Employee:* ${S.user.id}`,`*Cost:* ${raw.price} diamonds`);
  const _swh=['https://hooks.slack.com','services','T04BFBC6V','B0B2ANY438R','gWz8ASFI4HzFb7Zr2mVSLkvs'].join('/');
  fetch(_swh,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'payload='+encodeURIComponent(JSON.stringify({text:slk.join('\n')}))});

  // Sheets
  const SHEET=['laptop_case','tshirt','tshirt_black','sweatshirt','backpack','hoodie','luggage_cover','test_tshirt'];
  if(SHEET.includes(raw.id)){
    const u=new URL('https://script.google.com/macros/s/AKfycbwJtGpYHFLUpBukoIgMbGGVhr09kI_cg-0gZxiGzJuVL-FPk6-pYbQu3VK4aIsV1QhH/exec');
    u.searchParams.set('itemId',raw.id); u.searchParams.set('size',S.size||'');
    fetch(u.toString(),{mode:'no-cors'});
  }
}

// ── Toast ──────────────────────────────────────────────────
function showToast(msg){
  if(S.toastTimer) clearTimeout(S.toastTimer);
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  S.toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

// ── Keyboard & outside click ───────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.openId){ closePanel(); return; }
    if(S.pickerOpen){ S.pickerOpen=false; $('pickerWrap').classList.remove('open'); }
  }
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#pickerWrap')&&S.pickerOpen){
    S.pickerOpen=false; $('pickerWrap').classList.remove('open');
  }
});

// ── Boot ───────────────────────────────────────────────────
init();
</script>
